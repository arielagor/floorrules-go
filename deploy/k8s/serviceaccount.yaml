# Workload Identity: the pod runs as this KSA, which GKE maps to the Google
# service account below (see infra/terraform/main.tf for the IAM binding).
# No JSON key is ever mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floorsvc
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc
  annotations:
    iam.gke.io/gcp-service-account: floorsvc@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
