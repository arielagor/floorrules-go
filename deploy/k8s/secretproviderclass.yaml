# Secret Manager add-on (secret_manager_config in infra/terraform/main.tf).
# The CSI driver authenticates as the pod's Kubernetes ServiceAccount, which
# Terraform grants roles/secretmanager.secretAccessor on exactly these
# secrets; no Kubernetes Secret holds the values. Pin VERSION to a number
# when rotating deliberately; `latest` is read when the pod starts.
# Format per docs.cloud.google.com/kubernetes-engine/docs/how-to/use-secret-manager
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: floorsvc-secrets
  namespace: floorrules
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/floorsvc-auth-hmac-secret/versions/latest"
        path: "auth-hmac-secret"
      - resourceName: "projects/PROJECT_ID/secrets/floorsvc-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/floorsvc-db-server-ca/versions/latest"
        path: "server-ca.pem"
---
# The migrate Job's view: the migrator's DSN and the server CA, nothing else.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: floorsvc-migrate-secrets
  namespace: floorrules
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/floorsvc-migrate-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/floorsvc-db-server-ca/versions/latest"
        path: "server-ca.pem"
