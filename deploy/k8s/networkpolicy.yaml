# Default deny for every pod in the namespace, both directions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: floorrules
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Then allow only what floorsvc needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: floorsvc-allow
  namespace: floorrules
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: floorsvc
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # The API is exposed through a GKE Gateway of class
    # gke-l7-global-external-managed (global external Application Load
    # Balancer). It reaches pods through container-native NEGs, so requests
    # and health checks arrive from Google's ranges, not from a pod in the
    # cluster: GFE proxies 35.191.0.0/16 and 130.211.0.0/22, health checks
    # 35.191.0.0/16 (docs.cloud.google.com/load-balancing/docs/firewall-rules,
    # checked 2026-10-04). A regional or internal class (gke-l7-rilb,
    # gke-l7-regional-external-managed) instead needs the VPC's proxy-only
    # subnet here, plus 35.191.0.0/16 for health checks.
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - port: 8080
          protocol: TCP
    # Metrics: only Google Cloud Managed Service for Prometheus collectors,
    # which run in gke-gmp-system on Autopilot (gmp-system on Standard).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Cloud SQL private IP range (placeholder CIDR from infra/terraform).
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 5432
          protocol: TCP
    # GKE metadata server, needed for Workload Identity tokens.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - port: 988
          protocol: TCP
    # SSP / ad-server APIs over HTTPS. Narrow to egress-gateway IPs in a real cluster.
    - ports:
        - port: 443
          protocol: TCP
---
# The migrate Job: no ingress, egress to DNS and the database only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: floorsvc-migrate-allow
  namespace: floorrules
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: floorsvc-migrate
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 5432
          protocol: TCP
