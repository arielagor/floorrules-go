# Workload Identity: the pod runs as this KSA, which GKE maps to the Google
# service account below (see infra/terraform/main.tf for the IAM binding).
# No JSON key is ever mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floorsvc
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc
  annotations:
    iam.gke.io/gcp-service-account: floorsvc@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
# The migrate Job's identity, separate from the service's, so it alone can
# read the migrator's database credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floorsvc-migrate
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc-migrate
  annotations:
    iam.gke.io/gcp-service-account: floorsvc-migrate@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
