apiVersion: apps/v1
kind: Deployment
metadata:
  name: floorsvc
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: floorsvc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floorsvc
    spec:
      serviceAccountName: floorsvc
      # Workload Identity uses the GKE metadata server, not a mounted KSA token.
      automountServiceAccountToken: false
      # On SIGTERM the process fails readiness (SHUTDOWN_DRAIN), stops the
      # HTTP server, then waits for in-flight applies to record their result
      # (up to APPLY_TIMEOUT + RECORD_TIMEOUT). The grace period must cover
      # 5s + 2m10s + margin, or SIGKILL cuts an apply off midway.
      # cmd/floorsvc/deploy_test.go pins this.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: floorsvc
      containers:
        - name: floorsvc
          # Replace with the Artifact Registry digest produced by CI.
          image: REGION-docker.pkg.dev/PROJECT_ID/floorrules/floorsvc@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STORE_BACKEND
              value: postgres
            # Schema changes run in migrate-job.yaml as floorsvc_migrator;
            # this pod's DSN is floorsvc_app, which has no DDL rights.
            - name: RUN_MIGRATIONS
              value: "false"
            - name: AUTH_ISSUER
              value: https://auth.example.internal
            - name: AUTH_AUDIENCE
              value: floorrules
            - name: LOG_LEVEL
              value: info
            - name: SHUTDOWN_DRAIN
              value: 5s
            - name: SHUTDOWN_WAIT
              value: 20s
            - name: APPLY_TIMEOUT
              value: 2m
            - name: RECORD_TIMEOUT
              value: 10s
            - name: APPLY_LEASE
              value: 5m
            # Secrets arrive as files, never as env values.
            - name: AUTH_HMAC_SECRET_FILE
              value: /var/run/secrets/floorrules/auth-hmac-secret
            - name: DATABASE_URL_FILE
              value: /var/run/secrets/floorrules/database-url
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/floorrules
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 64Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: secrets
          secret:
            # Populated from Secret Manager (e.g. External Secrets or the
            # Secret Manager CSI driver); never committed.
            secretName: floorsvc-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
