# Workload Identity Federation for GKE: Terraform grants Secret Manager
# access to these KSAs as principals
# (principal://.../subject/ns/floorrules/sa/NAME), and the Secret Manager
# CSI driver authenticates as them. No Google service account and no JSON
# key is involved.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floorsvc
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc
automountServiceAccountToken: false
---
# The migrate Job's identity, separate from the service's, so it alone can
# read the migrator's database credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floorsvc-migrate
  namespace: floorrules
  labels:
    app.kubernetes.io/name: floorsvc-migrate
automountServiceAccountToken: false
